<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // Suppress WebSocket closure errors in iframe environment where HMR is disabled
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (event.reason.message || '').indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if ((event.message || '').indexOf('WebSocket') !== -1 || (event.filename || '').indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        try {
          var t = localStorage.getItem('sales_hub_theme_v2') || localStorage.getItem('sales_hub_theme') || 'dark';
          var doc = document.documentElement;
          doc.classList.remove('dark', 'light');
          doc.classList.add(t);
          doc.style.colorScheme = t;
        } catch(e) {}
      })();
    </script>
