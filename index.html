<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // Suppress benign Vite HMR WebSocket closure messages in dev environment where HMR is disabled
        var origError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + ((arg && (arg.stack || arg.message)) || String(arg));
          }
          if (str.indexOf('WebSocket') !== -1 || (str.indexOf('[vite]') !== -1 && str.indexOf('WebSocket') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event.message || '') + ' ' + ((event.error && (event.error.message || event.error.stack)) || '') + ' ' + (event.filename || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        try {
          var t = localStorage.getItem('sales_hub_theme_v2') || localStorage.getItem('sales_hub_theme') || 'dark';
          var doc = document.documentElement;
          doc.classList.remove('dark', 'light');
          doc.classList.add(t);
          doc.style.colorScheme = t;
        } catch(e) {}
      })();
    </script>
